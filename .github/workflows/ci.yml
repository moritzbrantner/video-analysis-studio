name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify local-only source graph
        run: |
          jq -e '.schemaVersion == 1 and .cargo.localOnly == true' .coding-tooling.source-deps.json >/dev/null
          jq -e '.cargo.patches | length > 0 and all(.[]; (.package | length > 0) and (.git | length > 0) and (.rev | test("^[0-9a-f]{40}$")) and (.localPath | length > 0))' .coding-tooling.source-deps.json >/dev/null
          if grep -n 'secrets[.]GH_PACKAGES_TOKEN' .github/workflows/ci.yml; then
            echo "Hosted CI must not depend on private cross-repository source credentials." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Explain source verification boundary
        run: |
          echo "Rust check/test, generated API type verification, and desktop checks run in the local coding workspace against the exact sibling source graph."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck UI
        run: bun run --cwd apps/ui typecheck
      - name: Test UI
        run: bun run --cwd apps/ui test
      - name: Build UI
        run: bun run --cwd apps/ui build
      - name: Install Playwright browsers with project version
        working-directory: apps/ui
        run: bun run playwright install --with-deps chromium
      - name: Run UI e2e smoke
        run: bun run --cwd apps/ui test:e2e
