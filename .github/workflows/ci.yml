name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Configure private dependency auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.RUST_PACKAGES_TOKEN }}@github.com/moritzbrantner/".insteadOf "https://github.com/moritzbrantner/"
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck UI
        run: bun run --cwd apps/ui typecheck
      - name: Build UI
        run: bun run --cwd apps/ui build

  desktop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Configure private dependency auth
        run: |
          git config --global url."https://x-access-token:${{ secrets.RUST_PACKAGES_TOKEN }}@github.com/moritzbrantner/".insteadOf "https://github.com/moritzbrantner/"
      - name: Desktop cargo check
        run: cargo check -p studio-desktop
