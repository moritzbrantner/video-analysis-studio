name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify local-only source graph
        run: |
          jq -e '.schemaVersion == 2 and .cargo.localOnly == true' .coding-tooling.source-deps.json >/dev/null
          jq -e '.cargo.patches | length > 0 and all(.[]; (.package | length > 0) and (.git | length > 0) and (.rev | test("^[0-9a-f]{40}$")) and (.localPath | length > 0))' .coding-tooling.source-deps.json >/dev/null
      - name: Verify capability composition boundaries
        run: |
          python3 scripts/test_check_dependency_boundaries.py
          python3 scripts/check_dependency_boundaries.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Explain source verification boundary
        run: |
          echo "Rust check/test, generated API type verification, and desktop checks run in the local coding workspace against the exact sibling source graph."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck UI
        run: bun run --cwd apps/ui typecheck
      - name: Test UI
        run: bun run --cwd apps/ui test
      - name: Build UI
        run: bun run --cwd apps/ui build
      - name: Install Playwright browsers with project version
        working-directory: apps/ui
        run: bun run playwright install --with-deps chromium
      - name: Run UI e2e smoke
        run: bun run --cwd apps/ui test:e2e

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["source-contract", "frontend"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["source-contract", "frontend"]'
