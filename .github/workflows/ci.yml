name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Require private source token
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "GH_PACKAGES_TOKEN must have contents:read access to audio-analysis, nlp-stack, visual-analysis, and coding-tooling." >&2
            exit 1
          fi
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Configure private dependency auth
        run: |
          git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/moritzbrantner/".insteadOf "https://github.com/moritzbrantner/"
      - name: Check out source-dependency tooling
        uses: actions/checkout@v5
        with:
          repository: moritzbrantner/coding-tooling
          ref: f9133fe3ca885c2538d2fc92cd52427f4b7ab738
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          path: .source/coding-tooling
          persist-credentials: false
      - name: Activate exact source graph
        env:
          CODING_TOOLING_DIR: ${{ github.workspace }}/.source/coding-tooling
        run: |
          bash scripts/source-deps activate
          bash scripts/source-deps status
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck UI
        run: bun run --cwd apps/ui typecheck
      - name: Test UI
        run: bun run --cwd apps/ui test
      - name: Require private source token for generated API check
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "GH_PACKAGES_TOKEN must have contents:read access to audio-analysis, nlp-stack, visual-analysis, and coding-tooling." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure private dependency auth
        run: |
          git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/moritzbrantner/".insteadOf "https://github.com/moritzbrantner/"
      - name: Check out source-dependency tooling
        uses: actions/checkout@v5
        with:
          repository: moritzbrantner/coding-tooling
          ref: f9133fe3ca885c2538d2fc92cd52427f4b7ab738
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          path: .source/coding-tooling
          persist-credentials: false
      - name: Activate exact source graph
        env:
          CODING_TOOLING_DIR: ${{ github.workspace }}/.source/coding-tooling
        run: bash scripts/source-deps activate
      - name: Check generated API types
        run: bun run api:types:check
      - name: Build UI
        run: bun run --cwd apps/ui build
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run UI e2e smoke
        run: bun run --cwd apps/ui test:e2e

  desktop-check:
    runs-on: ubuntu-latest
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Require private source token
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "GH_PACKAGES_TOKEN must have contents:read access to audio-analysis, nlp-stack, visual-analysis, and coding-tooling." >&2
            exit 1
          fi
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Configure private dependency auth
        run: |
          git config --global url."https://x-access-token:${GH_PACKAGES_TOKEN}@github.com/moritzbrantner/".insteadOf "https://github.com/moritzbrantner/"
      - name: Check out source-dependency tooling
        uses: actions/checkout@v5
        with:
          repository: moritzbrantner/coding-tooling
          ref: f9133fe3ca885c2538d2fc92cd52427f4b7ab738
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          path: .source/coding-tooling
          persist-credentials: false
      - name: Activate exact source graph
        env:
          CODING_TOOLING_DIR: ${{ github.workspace }}/.source/coding-tooling
        run: bash scripts/source-deps activate
      - name: Desktop cargo check
        run: cargo check -p studio-desktop
