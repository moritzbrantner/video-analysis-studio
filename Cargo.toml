[workspace]
members = [
  "crates/studio-core",
  "crates/studio-api",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
audio-analysis-processing = { version = "0.1.0", path = "../rust-packages/crates/audio/audio-analysis-processing" }
audio-analysis-recognition = { version = "0.1.0", path = "../rust-packages/crates/audio/audio-analysis-recognition" }
text-analysis-features = { version = "0.1.0", path = "../rust-packages/crates/text/text-analysis-features" }
text-analysis-transcription = { version = "0.1.0", path = "../rust-packages/crates/text/text-analysis-transcription" }
video-analysis-core = { version = "0.1.0", path = "../rust-packages/crates/video/video-analysis-core" }
video-analysis-data = { version = "0.1.0", path = "../rust-packages/crates/video/video-analysis-data" }
video-analysis-detectors = { version = "0.1.0", path = "../rust-packages/crates/video/video-analysis-detectors" }
video-analysis-ffmpeg = { version = "0.1.0", path = "../rust-packages/crates/video/video-analysis-ffmpeg" }
video-analysis-ingest = { version = "0.1.0", path = "../rust-packages/crates/video/video-analysis-ingest" }
video-analysis-models = { version = "0.1.0", path = "../rust-packages/crates/video/video-analysis-models" }
video-analysis-segmentation = { version = "0.1.0", path = "../rust-packages/crates/video/video-analysis-segmentation" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
futures = "0.3"
http = "1"
num-rational = "0.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = "0.32.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "fs", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
