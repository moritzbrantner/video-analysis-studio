[workspace]
members = [
  "crates/studio-core",
  "crates/studio-api",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
video-analysis-core = { git = "https://github.com/moritzbrantner/rust-packages.git", branch = "main" }
video-analysis-data = { git = "https://github.com/moritzbrantner/rust-packages.git", branch = "main" }
video-analysis-detectors = { git = "https://github.com/moritzbrantner/rust-packages.git", branch = "main" }
video-analysis-ffmpeg = { git = "https://github.com/moritzbrantner/rust-packages.git", branch = "main" }
video-analysis-ingest = { git = "https://github.com/moritzbrantner/rust-packages.git", branch = "main" }
video-analysis-models = { git = "https://github.com/moritzbrantner/rust-packages.git", branch = "main" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
http = "1"
num-rational = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.32"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "fs", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
