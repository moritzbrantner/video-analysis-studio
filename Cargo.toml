[workspace]
members = [
  "crates/studio-core",
  "crates/studio-api",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
# Registry coordinates remain the distribution contract. Ordinary cross-repository
# development activates exact source revisions from .coding-tooling.source-deps.json.
audio-analysis-processing = { package = "moenarch-audio-analysis-processing", version = "=0.1.0" }
audio-analysis-recognition = { package = "moenarch-audio-analysis-recognition", version = "=0.1.0" }
audio-analysis-transcription = { package = "moenarch-audio-analysis-transcription", version = "=0.1.15" }
text-transcripts = { package = "moenarch-text-transcripts", version = "=0.1.3" }
video-analysis-core = { package = "moenarch-video-analysis-core", version = "=0.1.3" }
video-analysis-data = { package = "moenarch-video-analysis-data", version = "=0.1.0" }
video-analysis-detectors = { package = "moenarch-video-analysis-detectors", version = "=0.1.0" }
video-analysis-ffmpeg = { package = "moenarch-video-analysis-ffmpeg", version = "=0.1.1" }
video-analysis-ingest = { package = "moenarch-video-analysis-ingest", version = "=0.1.0" }
# Keep the local dependency key stable while consuming the canonical recognition owner.
video-analysis-models = { package = "moenarch-video-analysis-recognition", version = "=0.1.0" }
video-analysis-segmentation = { package = "moenarch-video-analysis-segmentation", version = "=0.1.0" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
futures = "0.3"
http = "1"
num-rational = "0.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = "0.32.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "fs", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
