[workspace]
members = [
  "crates/studio-core",
  "crates/studio-api",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
audio-analysis-recognition = { path = "../rust-packages/crates/audio/audio-analysis-recognition" }
text-analysis-transcription = { path = "../rust-packages/crates/text/text-analysis-transcription" }
video-analysis-core = { path = "../rust-packages/crates/video/video-analysis-core" }
video-analysis-data = { path = "../rust-packages/crates/video/video-analysis-data" }
video-analysis-detectors = { path = "../rust-packages/crates/video/video-analysis-detectors" }
video-analysis-ffmpeg = { path = "../rust-packages/crates/video/video-analysis-ffmpeg" }
video-analysis-ingest = { path = "../rust-packages/crates/video/video-analysis-ingest" }
video-analysis-models = { path = "../rust-packages/crates/video/video-analysis-models" }
video-analysis-use-cases = { path = "../rust-packages/crates/video/video-analysis-use-cases" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
http = "1"
num-rational = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.32"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "fs", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
